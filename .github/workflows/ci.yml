name: CI

on:
  push:
  pull_request:

jobs:
  pc-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc-agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w" -o /tmp/asus-pc-agent.exe .

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # gradle.properties pins the developer's Windows JDK; the user-level file takes precedence.
      - run: mkdir -p ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
      - run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
